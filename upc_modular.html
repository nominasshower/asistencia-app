<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal UPC Modular</title>
<style>
  :root{--bg:#0f1720;--panel:#1a2530;--panel2:#20303d;--border:#2c3e4c;--text:#e8eef2;--muted:#8fa3b0;--accent:#3fb8af;--accent2:#f2a154;--danger:#e06565;--good:#4caf7d;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px;}
  @media(max-width:600px){body{padding:16px;}}
  h1{font-size:22px;margin:0 0 4px;} .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .stat b{display:block;font-size:22px;} .stat span{color:var(--muted);font-size:12px;}
  .filters{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;align-items:end;}
  @media(max-width:900px){.filters{grid-template-columns:1fr 1fr;}.filters .wide{grid-column:1/-1;}}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:14px;width:100%;font-family:inherit;}
  button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;}
  button:hover{border-color:var(--accent);} button:disabled{opacity:.4;cursor:default;}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted);}
  .scroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--panel);}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  th{background:var(--panel2);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;}
  th:hover{color:var(--text);} tr:hover td{background:#1d2b37;}
  .mono{font-family:Consolas,monospace;white-space:nowrap;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--panel2);border:1px solid var(--border);white-space:nowrap;}
  .v3{color:var(--good);border-color:var(--good);} .v2{color:var(--accent2);border-color:var(--accent2);} .v1,.v0{color:var(--muted);}
  .copy{cursor:pointer;} .copy:hover{color:var(--accent);}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;}
  .err{background:#3a1d1d;border:1px solid var(--danger);padding:12px;border-radius:8px;margin-bottom:12px;display:none;}
</style>
</head>
<body>
<h1>Portal UPC · Modular</h1>
<div class="sub">Códigos GTIN-14 de Modular Vanity Tops, Modul Woods, Kuartz y Shower Walls. Clic en un código para copiarlo.</div>
<div class="err" id="err"></div>
<div class="stats" id="stats"></div>
<div class="filters">
  <div class="wide"><label>Buscar (código, nombre, variante, descripción)</label><input id="fq" type="text" placeholder="Ej. 22x31 laguna, 0750302…"></div>
  <div><label>Marca</label><select id="fmarca"></select></div>
  <div><label>Nivel</label><select id="fnivel"><option value="">Todos</option><option>Unidad</option><option>Caja/paquete</option></select></div>
  <div><label>Verified</label><select id="fver"><option value="">Todos</option><option value="0">0 · Innovación</option><option value="1">1 · No enviado</option><option value="2">2 · Enviado incompleto</option><option value="3">3 · Enviado completo</option></select></div>
  <div><label>&nbsp;</label><button id="fclr">Limpiar filtros</button></div>
</div>
<div class="bar"><span id="count"></span><button id="csv">Descargar CSV (lo filtrado)</button></div>
<div class="scroll"><table>
  <thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody>
</table></div>
<div class="pager"><button id="prev">‹</button><span id="pg"></span><button id="next">›</button></div>

<script>
const SUP_URL='https://xzwlbrirzfogbqhywtvj.supabase.co';
const SUP_KEY='sb_publishable_tCmUG5g7RZbqPPFD3G4U7w_jLrsu01G';
const H={apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY};
const COLS=[['codigo_completo','Código (GTIN-14)'],['nombre','Nombre'],['marca','Marca'],['variante','Variante'],['nivel','Nivel'],['contenido_neto','Cont.'],['unidad','Unidad'],['codigo_interno','Cód. interno'],['estatus_verified','Verified']];
const VER={0:'0 · Innovación',1:'1 · No enviado',2:'2 · Enviado incompleto',3:'3 · Enviado completo'};
const PAGE=50; let rows=[],view=[],page=0,sortK='id_origen',sortD=1;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

async function load(){
  let all=[],from=0;
  while(true){
    const r=await fetch(`${SUP_URL}/rest/v1/upc_modular?select=*&order=id_origen.asc&limit=1000&offset=${from}`,{headers:H});
    if(!r.ok) throw new Error(await r.text());
    const b=await r.json(); all=all.concat(b); if(b.length<1000) break; from+=1000;
  }
  rows=all.map(r=>({...r,_q:norm([r.codigo_completo,r.nombre,r.variante,r.descripcion,r.codigo_interno,r.marca].join(' '))}));
  const marcas=[...new Set(rows.map(r=>r.marca).filter(Boolean))].sort();
  $('fmarca').innerHTML='<option value="">Todas</option>'+marcas.map(m=>`<option>${esc(m)}</option>`).join('');
  render();
}
function stats(){
  const c=k=>rows.filter(k).length;
  $('stats').innerHTML=[['Total',rows.length],['Unidad',c(r=>r.nivel==='Unidad')],['Caja/paquete',c(r=>r.nivel!=='Unidad')],
   ['Verified completo',c(r=>r.estatus_verified==3)],['Sin nombre',c(r=>!r.nombre)]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}
function filt(){
  const q=norm($('fq').value).trim().split(/\s+/).filter(Boolean),m=$('fmarca').value,n=$('fnivel').value,v=$('fver').value;
  view=rows.filter(r=>(!m||r.marca===m)&&(!n||r.nivel===n)&&(v===''||String(r.estatus_verified)===v)&&q.every(t=>r._q.includes(t)));
  view.sort((a,b)=>{const x=a[sortK]==null?'':a[sortK],y=b[sortK]==null?'':b[sortK];return (x>y?1:x<y?-1:0)*sortD;});
}
function render(){
  stats(); filt();
  const pages=Math.max(1,Math.ceil(view.length/PAGE)); if(page>=pages) page=pages-1;
  $('thead').innerHTML=COLS.map(([k,l])=>`<th data-k="${k}">${l}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`).join('');
  $('tbody').innerHTML=view.slice(page*PAGE,page*PAGE+PAGE).map(r=>`<tr>
    <td class="mono copy" title="Copiar" data-c="${esc(r.codigo_completo)}">${esc(r.codigo_completo)}</td>
    <td>${esc(r.nombre)||'<span class="tag">sin nombre</span>'}</td><td>${esc(r.marca)}</td><td>${esc(r.variante)}</td>
    <td>${esc(r.nivel)}</td><td>${r.contenido_neto}</td><td>${esc(r.unidad)}</td><td class="mono">${esc(r.codigo_interno)}</td>
    <td><span class="tag v${r.estatus_verified}">${VER[r.estatus_verified]||r.estatus_verified}</span></td></tr>`).join('')
    ||'<tr><td colspan="9" style="text-align:center;color:var(--muted)">Sin resultados</td></tr>';
  $('count').textContent=`${view.length} de ${rows.length} códigos`;
  $('pg').textContent=`Página ${page+1} de ${pages}`; $('prev').disabled=page===0; $('next').disabled=page>=pages-1;
}
['fq','fmarca','fnivel','fver'].forEach(id=>$(id).addEventListener('input',()=>{page=0;render();}));
$('fclr').onclick=()=>{['fq','fmarca','fnivel','fver'].forEach(id=>$(id).value='');page=0;render();};
$('prev').onclick=()=>{page--;render();}; $('next').onclick=()=>{page++;render();};
$('thead').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sortD=sortK===k?-sortD:1;sortK=k;render();};
$('tbody').onclick=e=>{const c=e.target.dataset.c;if(c){if(navigator.clipboard)navigator.clipboard.writeText(c);const t=e.target.textContent;e.target.textContent='✓ copiado';setTimeout(()=>e.target.textContent=t,900);}};
$('csv').onclick=()=>{
  const k=['codigo_completo','nombre','marca','variante','nivel','contenido_neto','unidad','codigo_interno','descripcion','estatus_verified'];
  const t=[k.join(',')].concat(view.map(r=>k.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download='upc_modular.csv';a.click();
};
load().catch(e=>{$('err').style.display='block';$('err').textContent=/relation|does not exist|42P01|PGRST205/.test(e.message)?'La tabla upc_modular aún no existe: corre upc_modular_setup.sql en el SQL Editor de Supabase.':'Error: '+e.message;});
</script>
</body>
</html>
